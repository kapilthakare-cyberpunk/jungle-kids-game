<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jungle Coloring</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1f0d;font-family:'Fredoka One',cursive;overflow:hidden;height:100vh;width:100vw;display:flex;flex-direction:column;user-select:none;}
#app{display:flex;flex-direction:column;height:100vh;padding:10px;gap:8px;}
#titlebar{text-align:center;color:#ffd93d;font-size:clamp(1.5rem,3vw,2.5rem);text-shadow:0 3px 0 #b8860b;flex-shrink:0;}
a.home{position:fixed;top:12px;left:12px;background:rgba(255,215,61,0.2);border:2px solid #ffd93d;border-radius:10px;padding:5px 12px;color:#ffd93d;font-family:'Fredoka One',cursive;font-size:.9rem;text-decoration:none;z-index:9;}
#animalbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;flex-shrink:0;}
.abtn{background:rgba(255,255,255,0.1);border:3px solid rgba(255,255,255,0.2);border-radius:14px;padding:6px 12px;cursor:pointer;font-family:'Fredoka One',cursive;color:white;font-size:clamp(.8rem,1.3vw,1.1rem);display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .2s;min-width:70px;}
.abtn .em{font-size:clamp(1.5rem,2.5vw,2.2rem);}
.abtn:hover,.abtn.on{background:rgba(255,215,61,0.3);border-color:#ffd93d;transform:scale(1.07);}
#main{display:flex;gap:10px;flex:1;min-height:0;}
#csec{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
#cwrap{position:relative;flex:1;width:100%;min-height:0;background:#fffff0;border-radius:18px;border:5px solid #ffd93d;overflow:hidden;box-shadow:0 0 0 3px #b8860b,0 8px 30px rgba(0,0,0,0.6);cursor:crosshair;}
#cc,#oc{position:absolute;inset:0;width:100%;height:100%;}
#cc{z-index:1;}#oc{z-index:2;pointer-events:none;}
#tools{display:flex;justify-content:center;gap:8px;flex-shrink:0;align-items:center;flex-wrap:wrap;}
.tbtn{background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.3);border-radius:12px;padding:6px 14px;cursor:pointer;font-family:'Fredoka One',cursive;color:white;font-size:clamp(.8rem,1.3vw,1rem);display:flex;align-items:center;gap:5px;transition:all .2s;}
.tbtn:hover{background:rgba(255,255,255,0.3);transform:scale(1.05);}
.tbtn.on{background:rgba(255,215,61,0.4);border-color:#ffd93d;}
#pal{display:flex;flex-direction:column;gap:6px;align-items:center;width:clamp(65px,8vw,100px);flex-shrink:0;}
#cgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:1;width:100%;}
.sw{aspect-ratio:1;border-radius:9px;cursor:pointer;border:4px solid transparent;transition:all .15s;box-shadow:0 3px 6px rgba(0,0,0,0.4);}
.sw:hover{transform:scale(1.15);}
.sw.on{border-color:white;transform:scale(1.2);box-shadow:0 0 0 3px rgba(255,255,255,0.6);}
#ccd{width:100%;aspect-ratio:1.5;border-radius:10px;border:4px solid white;box-shadow:0 4px 10px rgba(0,0,0,0.5);flex-shrink:0;}
#bsizes{display:flex;flex-direction:column;gap:5px;align-items:center;width:100%;}
.bbtn{border-radius:50%;background:white;border:3px solid rgba(255,255,255,0.3);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.bbtn:hover{transform:scale(1.15);border-color:#ffd93d;}
.bbtn.on{border-color:#ffd93d;box-shadow:0 0 10px rgba(255,215,61,0.6);}
#cel{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.75);align-items:center;justify-content:center;flex-direction:column;gap:16px;}
#cel.show{display:flex;}
#cel h2{font-family:'Fredoka One',cursive;font-size:clamp(3rem,7vw,5rem);color:#ffd93d;text-shadow:0 4px 0 #b8860b;animation:bop .5s infinite alternate;}
@keyframes bop{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.05) rotate(3deg)}}
.cbtn{font-family:'Fredoka One',cursive;font-size:1.5rem;background:#ffd93d;border:none;border-radius:50px;padding:12px 36px;cursor:pointer;color:#1a2e1a;box-shadow:0 5px 0 #b8860b;}
.conf{position:fixed;width:11px;height:11px;border-radius:3px;animation:fall 3s ease-in forwards;pointer-events:none;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<a href="../index.html" class="home">🏠 Home</a>
<div id="app">
  <div id="titlebar">🌿 Jungle Coloring 🌿</div>
  <div id="animalbar">
    <button class="abtn on" onclick="sel('lion')" id="b-lion"><span class="em">🦁</span>Lion</button>
    <button class="abtn" onclick="sel('elephant')" id="b-elephant"><span class="em">🐘</span>Elephant</button>
    <button class="abtn" onclick="sel('monkey')" id="b-monkey"><span class="em">🐒</span>Monkey</button>
    <button class="abtn" onclick="sel('giraffe')" id="b-giraffe"><span class="em">🦒</span>Giraffe</button>
    <button class="abtn" onclick="sel('frog')" id="b-frog"><span class="em">🐸</span>Frog</button>
    <button class="abtn" onclick="sel('parrot')" id="b-parrot"><span class="em">🦜</span>Parrot</button>
  </div>
  <div id="main">
    <div id="csec">
      <div id="cwrap"><canvas id="cc"></canvas><canvas id="oc"></canvas></div>
      <div id="tools">
        <button class="tbtn on" id="b-brush" onclick="setT('brush')">🖌️ Paint</button>
        <button class="tbtn" id="b-fill" onclick="setT('fill')">🪣 Fill</button>
        <button class="tbtn" id="b-eraser" onclick="setT('eraser')">🧹 Erase</button>
        <button class="tbtn" onclick="clr()">🗑️ Clear</button>
        <button class="tbtn" onclick="celebrate()">🎉 Done!</button>
      </div>
    </div>
    <div id="pal">
      <div style="color:#ffd93d;font-size:.8rem;text-align:center">Color</div>
      <div id="ccd"></div>
      <div id="cgrid"></div>
      <div style="color:#ffd93d;font-size:.7rem;text-align:center;margin-top:3px">Size</div>
      <div id="bsizes"></div>
    </div>
  </div>
</div>
<div id="cel">
  <h2>Amazing! 🎉</h2>
  <div style="font-family:'Fredoka One';font-size:2rem;color:white">You're a Jungle Artist!</div>
  <button class="cbtn" onclick="document.getElementById('cel').classList.remove('show')">Keep Coloring! 🖌️</button>
</div>
<script>
const COLS=['#ff3b30','#ff9500','#ffd93d','#34c759','#007aff','#5856d6','#ff2d55','#af52de','#00c7be','#32ade6','#ffffff','#8b5e3c','#1a2e1a','#ff6b35','#a8d8ea','#000000'];
const ANIMALS={
lion:(ctx,w,h)=>{const s=Math.min(w,h)/400;ctx.save();ctx.translate(w/2,h/2);ctx.scale(s,s);ctx.lineWidth=10;ctx.strokeStyle='#222';ctx.lineCap='round';ctx.lineJoin='round';for(let a=0;a<Math.PI*2;a+=Math.PI/8){ctx.beginPath();ctx.moveTo(Math.cos(a)*130,Math.sin(a)*130);ctx.lineTo(Math.cos(a)*162,Math.sin(a)*162);ctx.stroke();}ctx.beginPath();ctx.arc(0,0,128,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,185,110,140,0,0,Math.PI*2);ctx.stroke();[-45,45].forEach(x=>{ctx.beginPath();ctx.arc(x,-18,20,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x,-18,10,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();ctx.beginPath();ctx.arc(x-5,-24,4,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();});ctx.beginPath();ctx.moveTo(-15,22);ctx.lineTo(0,37);ctx.lineTo(15,22);ctx.closePath();ctx.fillStyle='#d4607a';ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,37);ctx.quadraticCurveTo(-30,62,-45,52);ctx.stroke();ctx.beginPath();ctx.moveTo(0,37);ctx.quadraticCurveTo(30,62,45,52);ctx.stroke();[[-108,-88],[108,-88]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.stroke();});[[-55,55],[55,55],[-35,55],[35,55]].forEach(([x])=>{ctx.beginPath();ctx.roundRect(x-20,285,40,95,20);ctx.stroke();});ctx.beginPath();ctx.moveTo(105,200);ctx.bezierCurveTo(165,148,185,48,142,-18);ctx.lineWidth=13;ctx.stroke();ctx.beginPath();ctx.arc(142,-18,22,0,Math.PI*2);ctx.lineWidth=10;ctx.stroke();ctx.restore();},
elephant:(ctx,w,h)=>{const s=Math.min(w,h)/420;ctx.save();ctx.translate(w/2,h/2);ctx.scale(s,s);ctx.lineWidth=12;ctx.strokeStyle='#222';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.ellipse(0,120,150,120,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(-60,-60,110,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-120,-10);ctx.bezierCurveTo(-185,22,-192,102,-150,132);ctx.bezierCurveTo(-130,147,-98,132,-118,112);ctx.lineWidth=22;ctx.stroke();ctx.lineWidth=12;ctx.beginPath();ctx.ellipse(42,-50,72,90,0.4,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(-90,-80,18,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(-90,-80,9,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();[[-90,0],[-30,0],[30,0],[90,0]].forEach(([x])=>{ctx.beginPath();ctx.roundRect(x-22,212,44,112,20);ctx.stroke();});ctx.beginPath();ctx.moveTo(-132,2);ctx.bezierCurveTo(-200,22,-200,60,-170,60);ctx.lineWidth=10;ctx.stroke();ctx.restore();},
monkey:(ctx,w,h)=>{const s=Math.min(w,h)/400;ctx.save();ctx.translate(w/2,h/2);ctx.scale(s,s);ctx.lineWidth=10;ctx.strokeStyle='#222';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.ellipse(0,140,90,110,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,100,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,20,62,72,0,0,Math.PI*2);ctx.stroke();[[-100,-10],[100,-10]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fillStyle='#ffccaa';ctx.fill();ctx.stroke();});[[-35,-25],[35,-25]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();});ctx.beginPath();ctx.arc(0,45,30,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.moveTo(-85,80);ctx.bezierCurveTo(-160,60,-182,130,-160,172);ctx.lineWidth=18;ctx.stroke();ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(85,80);ctx.bezierCurveTo(160,60,182,130,160,172);ctx.lineWidth=18;ctx.stroke();ctx.lineWidth=10;[[-160,172],[160,172]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.stroke();});[[-45,230],[45,230]].forEach(([x,y])=>{ctx.beginPath();ctx.roundRect(x-22,y,44,122,20);ctx.stroke();});ctx.beginPath();ctx.moveTo(82,182);ctx.bezierCurveTo(162,162,202,62,182,-28);ctx.bezierCurveTo(172,-80,140,-80,132,-50);ctx.lineWidth=14;ctx.stroke();ctx.restore();},
giraffe:(ctx,w,h)=>{const s=Math.min(w,h)/520;ctx.save();ctx.translate(w/2,h/2);ctx.scale(s,s);ctx.lineWidth=11;ctx.strokeStyle='#222';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.ellipse(0,120,112,92,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-40,50);ctx.lineTo(-60,-200);ctx.lineTo(20,-200);ctx.lineTo(40,50);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.ellipse(-20,-240,50,40,0.3,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(-50,-230,25,18,0.5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(-5,-255,14,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(-5,-255,7,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();[[-30,-275],[0,-280]].forEach(([x,y])=>{ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-35);ctx.lineWidth=8;ctx.stroke();ctx.beginPath();ctx.arc(x,y-35,8,0,Math.PI*2);ctx.lineWidth=11;ctx.stroke();});ctx.lineWidth=4;[[-10,-80,20],[10,-130,15],[-5,-160,18],[20,-50,16],[-20,-30,14],[40,100,20],[-40,140,18],[10,80,22]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();});ctx.lineWidth=11;[[-70,0],[-25,0],[25,0],[70,0]].forEach(([x])=>{ctx.beginPath();ctx.roundRect(x-18,185,36,132,15);ctx.stroke();});ctx.restore();},
frog:(ctx,w,h)=>{const s=Math.min(w,h)/380;ctx.save();ctx.translate(w/2,h/2);ctx.scale(s,s);ctx.lineWidth=10;ctx.strokeStyle='#222';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.ellipse(0,50,132,120,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,-60,100,0,Math.PI*2);ctx.stroke();[[-60,-150],[60,-150]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,45,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();ctx.beginPath();ctx.arc(x-8,y-8,10,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();});ctx.beginPath();ctx.arc(0,-30,65,0.1,Math.PI-0.1);ctx.stroke();ctx.beginPath();ctx.ellipse(0,60,80,80,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-120,20);ctx.bezierCurveTo(-182,0,-192,62,-160,82);ctx.lineWidth=16;ctx.stroke();ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(120,20);ctx.bezierCurveTo(182,0,192,62,160,82);ctx.lineWidth=16;ctx.stroke();ctx.lineWidth=10;[[-160,82],[160,82]].forEach(([fx,fy])=>{[-20,0,20].forEach(d=>{ctx.beginPath();ctx.arc(fx+d,fy+20,12,0,Math.PI*2);ctx.stroke();});});ctx.beginPath();ctx.moveTo(-100,132);ctx.bezierCurveTo(-182,162,-202,222,-170,242);ctx.lineWidth=20;ctx.stroke();ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(100,132);ctx.bezierCurveTo(182,162,202,222,170,242);ctx.lineWidth=20;ctx.stroke();ctx.lineWidth=10;ctx.restore();},
parrot:(ctx,w,h)=>{const s=Math.min(w,h)/400;ctx.save();ctx.translate(w/2,h/2);ctx.scale(s,s);ctx.lineWidth=10;ctx.strokeStyle='#222';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.ellipse(0,80,90,112,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(70,20);ctx.bezierCurveTo(132,0,152,102,120,162);ctx.bezierCurveTo(100,182,60,172,60,142);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(0,172);ctx.bezierCurveTo(-22,222,-32,282,-20,322);ctx.lineWidth=14;ctx.stroke();ctx.beginPath();ctx.moveTo(0,172);ctx.bezierCurveTo(22,232,37,292,27,332);ctx.lineWidth=12;ctx.stroke();ctx.lineWidth=10;ctx.beginPath();ctx.arc(0,-80,80,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-20,-55);ctx.bezierCurveTo(-62,-40,-66,-10,-40,-5);ctx.bezierCurveTo(-20,0,-10,-20,0,-30);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(30,-95,22,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(30,-95,11,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();ctx.beginPath();ctx.moveTo(-102,212);ctx.lineTo(102,212);ctx.lineWidth=14;ctx.strokeStyle='#8b5e3c';ctx.stroke();ctx.restore();}
};
let curA='lion',curC=COLS[0],curT='brush',bsz=20,drawing=false,lx=0,ly=0;
const cg=document.getElementById('cgrid');
COLS.forEach(c=>{const s=document.createElement('div');s.className='sw'+(c===curC?' on':'');s.style.background=c;s.onclick=()=>pickColor(c);cg.appendChild(s);});
document.getElementById('ccd').style.background=curC;
const bsc=document.getElementById('bsizes');
[12,22,38].forEach(sz=>{const b=document.createElement('div');b.className='bbtn'+(sz===bsz?' on':'');b.style.cssText=`width:${sz*1.4+18}px;height:${sz*1.4+18}px`;const d=document.createElement('div');d.style.cssText=`width:${sz}px;height:${sz}px;border-radius:50%;background:#333`;b.appendChild(d);b.onclick=()=>{bsz=sz;document.querySelectorAll('.bbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');};bsc.appendChild(b);});
function pickColor(c){curC=c;document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));[...document.querySelectorAll('.sw')].find(s=>s.style.background===c||s.style.background===h2r(c))?.classList.add('on');document.getElementById('ccd').style.background=c;if(curT==='eraser')setT('brush');}
function h2r(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgb(${r}, ${g}, ${b})`;}
const CC=document.getElementById('cc'),OC=document.getElementById('oc'),cc2=CC.getContext('2d'),oc2=OC.getContext('2d');
function resize(){const w=document.getElementById('cwrap');const W=w.clientWidth,H=w.clientHeight;[CC,OC].forEach(c=>{c.width=W;c.height=H;});cc2.fillStyle='#fffff0';cc2.fillRect(0,0,W,H);drawO();}
function drawO(){const W=OC.width,H=OC.height;oc2.clearRect(0,0,W,H);ANIMALS[curA]?.(oc2,W,H);}
function sel(n){curA=n;document.querySelectorAll('.abtn').forEach(b=>b.classList.remove('on'));document.getElementById('b-'+n)?.classList.add('on');
  if(window.enhancedTTS) {
    window.enhancedTTS.speak('Color the ' + n + '!');
  }
  clr();
}
function clr(){const W=CC.width,H=CC.height;cc2.fillStyle='#fffff0';cc2.fillRect(0,0,W,H);drawO();}
function setT(t){curT=t;['brush','fill','eraser'].forEach(x=>document.getElementById('b-'+x)?.classList.remove('on'));document.getElementById('b-'+t)?.classList.add('on');}
function gp(e){const r=CC.getBoundingClientRect();const sx=CC.width/r.width,sy=CC.height/r.height;const s=e.touches?e.touches[0]:e;return[(s.clientX-r.left)*sx,(s.clientY-r.top)*sy];}
function sd(e){e.preventDefault();const[x,y]=gp(e);if(curT==='fill'){fill(Math.round(x),Math.round(y));return;}drawing=true;lx=x;ly=y;cc2.beginPath();cc2.arc(x,y,curT==='eraser'?bsz*2:bsz/2,0,Math.PI*2);cc2.fillStyle=curT==='eraser'?'#fffff0':curC;cc2.fill();}
function mv(e){e.preventDefault();if(!drawing)return;const[x,y]=gp(e);cc2.beginPath();cc2.moveTo(lx,ly);cc2.lineTo(x,y);cc2.lineWidth=curT==='eraser'?bsz*4:bsz;cc2.strokeStyle=curT==='eraser'?'#fffff0':curC;cc2.lineCap='round';cc2.lineJoin='round';cc2.stroke();lx=x;ly=y;}
function ed(){drawing=false;}
CC.addEventListener('mousedown',sd);CC.addEventListener('mousemove',mv);CC.addEventListener('mouseup',ed);CC.addEventListener('mouseleave',ed);CC.addEventListener('touchstart',sd,{passive:false});CC.addEventListener('touchmove',mv,{passive:false});CC.addEventListener('touchend',ed);
function h2a(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];}
function fill(sx,sy){const W=CC.width,H=CC.height;const id=cc2.getImageData(0,0,W,H);const d=id.data;const fc=h2a(curC);const i=(sy*W+sx)*4;const tg=[d[i],d[i+1],d[i+2],d[i+3]];if(tg.every((v,j)=>v===fc[j]))return;const st=[[sx,sy]];const vis=new Uint8Array(W*H);const cm=i=>Math.abs(d[i]-tg[0])<35&&Math.abs(d[i+1]-tg[1])<35&&Math.abs(d[i+2]-tg[2])<35;while(st.length){const[x,y]=st.pop();if(x<0||x>=W||y<0||y>=H)continue;const vi=y*W+x;if(vis[vi])continue;vis[vi]=1;const pi=vi*4;if(!cm(pi))continue;d[pi]=fc[0];d[pi+1]=fc[1];d[pi+2]=fc[2];d[pi+3]=255;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}cc2.putImageData(id,0,0);}
function celebrate(){
  document.getElementById('cel').classList.add('show');
  if(window.enhancedTTS) {
    window.enhancedTTS.sayWellDone();
  }
  for(let i=0;i<70;i++){setTimeout(()=>{const c=document.createElement('div');c.className='conf';c.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${COLS[~~(Math.random()*COLS.length)]};animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),5000);},i*30);}}
window.addEventListener('resize',resize);setTimeout(resize,80);
</script>
<script type="module" src="/tts-client.js"></script>
</body>
</html>
