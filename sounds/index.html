<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Sounds</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at top,#0d2818,#061209);min-height:100vh;font-family:'Fredoka One',cursive;padding-bottom:28px;}
a.home{position:fixed;top:14px;left:14px;z-index:10;background:rgba(255,215,61,0.2);border:2px solid #ffd93d;border-radius:10px;padding:5px 13px;color:#ffd93d;font-family:'Fredoka One',cursive;font-size:.95rem;text-decoration:none;}
h1{color:#ffd93d;font-size:clamp(1.8rem,4vw,3rem);padding:18px;text-shadow:0 3px 0 #b8860b;text-align:center;}
#big{text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:8px;}
#be{font-size:clamp(5rem,13vw,9.5rem);filter:drop-shadow(0 5px 10px rgba(0,0,0,.4));}
#be.go{animation:bb .6s ease;}
@keyframes bb{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-5deg)}60%{transform:scale(.95) rotate(3deg)}to{transform:scale(1) rotate(0)}}
#st{color:white;font-size:clamp(1.4rem,3.5vw,2.5rem);margin-top:3px;min-height:46px;}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-width:940px;margin:0 auto;padding:0 14px;}
.ac{background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.15);border-radius:18px;padding:14px 9px;text-align:center;cursor:pointer;transition:all .2s;}
.ac:hover{transform:scale(1.08);border-color:#ffd93d;background:rgba(255,215,61,.15);}
.ac.pl{border-color:#34c759;background:rgba(52,199,89,.2);transform:scale(1.04);}
.ce{font-size:clamp(2.2rem,5.5vw,3.7rem);display:block;margin-bottom:5px;}
.cn{color:white;font-size:clamp(.85rem,1.7vw,1.1rem);}
.cs{color:rgba(255,255,255,.55);font-size:clamp(.65rem,1.2vw,.85rem);margin-top:1px;}
</style>
</head>
<body>
<a href="../index.html" class="home">🏠 Home</a>
<h1>🔊 Animal Sounds!</h1>
<div id="big"><div id="be">🦁</div><div id="st">Tap an animal!</div></div>
<div id="g"></div>
<script>
const A=[{e:'🦁',n:'Lion',s:'ROAAARRR! 🦁',say:"The lion says... ROAR!"},{e:'🐘',n:'Elephant',s:'PAROOO! 🎺',say:"The elephant says... PAROOO!"},{e:'🐒',n:'Monkey',s:'OOH OOH AAH!',say:"The monkey says... ooh ooh aah!"},{e:'🐸',n:'Frog',s:'RIBBIT RIBBIT!',say:"The frog says... ribbit ribbit!"},{e:'🦜',n:'Parrot',s:'SQUAWK! 🦜',say:"The parrot says... squawk squawk!"},{e:'🐅',n:'Tiger',s:'GRRRR! 🐅',say:"The tiger says... GRRR!"},{e:'🦛',n:'Hippo',s:'GRUNT GRUNT!',say:"The hippo says... grunt grunt!"},{e:'🐊',n:'Croc',s:'HISSSSS! 🐊',say:"The crocodile hisses!"},{e:'🦓',n:'Zebra',s:'NEIGH! 🦓',say:"The zebra says... neigh!"},{e:'🦏',n:'Rhino',s:'SNORT! 🦏',say:"The rhino snorts loudly!"},{e:'🐍',n:'Snake',s:'HISSSSS 🐍',say:"The snake says... hissss!"},{e:'🐦',n:'Bird',s:'TWEET TWEET!',say:"The bird says... tweet tweet!"},{e:'🦘',n:'Kangaroo',s:'CHORTLE!',say:"The kangaroo makes a chuckling sound!"},{e:'🦧',n:'Orangutan',s:'WHOOOP!',say:"The orangutan calls out... WHOOP!"},{e:'🦒',n:'Giraffe',s:'(very quiet)',say:"Giraffes are very quiet animals!"},{e:'🦋',n:'Butterfly',s:'(flutter)',say:"Butterflies flutter their wings silently!"}];
let playing=null;
function play(a,card){
  if(playing)playing.classList.remove('pl');playing=card;card.classList.add('pl');
  const be=document.getElementById('be');be.className='';be.offsetHeight;be.className='go';be.textContent=a.e;
  document.getElementById('st').textContent=a.s;
  speak(a.say);setTimeout(()=>{card.classList.remove('pl');playing=null;},2000);
}
function speak(t){
  // Use Enhanced TTS if available, fallback to browser speech synthesis
  if(window.enhancedTTS) {
    window.enhancedTTS.speak(t);
  } else {
    if(!speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.rate=.8;
    u.pitch=1.3;
    speechSynthesis.speak(u);
  }
}
const g=document.getElementById('g');
A.forEach(a=>{const c=document.createElement('div');c.className='ac';c.innerHTML=`<span class="ce">${a.e}</span><div class="cn">${a.n}</div><div class="cs">${a.s.split(' ')[0]}</div>`;c.onclick=()=>play(a,c);g.appendChild(c);});
</script>
<script type="module" src="/tts-client.js"></script>
</body>
</html>
